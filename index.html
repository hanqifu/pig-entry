<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脏小猪 · 进入游戏</title>
<style>
  body{font-family:"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#E8F5E9,#E3F2FD);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0;}
  .card{background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.12);max-width:400px;width:100%;padding:34px 26px;text-align:center;}
  .t{font-size:1.6rem;font-weight:900;color:#2E7D32;margin-bottom:8px;}
  .s{color:#999;font-size:.9rem;margin-bottom:20px;}
  .btn{display:inline-block;background:linear-gradient(135deg,#43A047,#2E7D32);color:#fff;font-weight:800;font-size:1.1rem;padding:14px 34px;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(46,125,50,.3);margin:6px 0;}
  .qr{background:#fff;border:1px solid #eee;border-radius:14px;padding:10px;display:inline-block;margin-top:14px;}
  .qr img{width:200px;height:200px;display:block;}
  .qrtip{font-size:.78rem;color:#999;margin-top:8px;}
  .tip{font-size:.8rem;color:#C62828;line-height:1.8;margin-top:12px;}
  .loading{color:#2E7D32;font-size:.85rem;}
</style>
</head>
<body>
  <div class="card">
    <div class="t">🐷 脏小猪</div>
    <div class="s">泥巴大作战 · 联机入口</div>
    <div class="loading" id="st">正在获取最新游戏地址…</div>
    <a class="btn" id="go" style="display:none;">🎮 进入游戏</a>
    <div class="qr" id="qrbox" style="display:none;"><img id="qrimg" alt="二维码"><div class="qrtip">也可以扫码直接进入</div></div>
    <div class="tip" id="off" style="display:none;">服务器当前未在线<br>请稍后再试，或联系房主开启公网</div>
  </div>
<script>
var SOURCES = [
  'https://hanqifu.github.io/pig-entry/addr.json',
  'https://cdn.jsdelivr.net/gh/hanqifu/pig-entry@main/addr.json',
  'https://raw.githubusercontent.com/hanqifu/pig-entry/main/addr.json'
];
function showErr(t){
  document.getElementById('st').textContent = t;
  document.getElementById('go').style.display = 'none';
  document.getElementById('qrbox').style.display = 'none';
  document.getElementById('off').style.display = 'block';
}
function render(d){
  if (d && d.on && d.url) {
    document.getElementById('st').textContent = '已获取最新地址，正在进入…';
    var go = document.getElementById('go');
    go.href = d.url;
    go.style.display = 'inline-block';
    if (d.qr) {
      document.getElementById('qrimg').src = d.qr;
      document.getElementById('qrbox').style.display = 'inline-block';
    }
    document.getElementById('off').style.display = 'none';
    setTimeout(function(){ location.href = d.url; }, 3000);
  } else {
    showErr('服务器当前未在线');
  }
}
function load(i){
  if (i >= SOURCES.length) { showErr('无法获取地址，请检查网络'); return; }
  fetch(SOURCES[i] + '?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){
    render(d);
  }).catch(function(){ load(i + 1); });
}
load(0);
setInterval(function(){ load(0); }, 15000);
</script>
</body>
</html>
